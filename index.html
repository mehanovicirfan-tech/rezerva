function openDB(){return new Promise(res=>{try{const r=indexedDB.open("rezerva",1);r.onupgradeneeded=()=>r.result.createObjectStore("items",{keyPath:"id"});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function dbAll(){return new Promise(res=>{if(!db)return res(null);try{const q=db.transaction("items").objectStore("items").getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)}catch(e){res(null)}})}
function dbPut(it){if(!db)return;try{db.transaction("items","readwrite").objectStore("items").put(it)}catch(e){}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const t=k=>T[S.lang][k];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const unitL=u=>S.lang==="fr"?(UNIT_TR[u]||u):u;
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysLeft(iso){if(!iso)return null;const [y,m,d]=iso.split("-").map(Number);const a=new Date(y,m-1,d);const n=new Date();const b=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((a-b)/86400000)}
function status(it){const d=daysLeft(it.expiry);if(d===null)return"none";if(d<0)return"bad";if(d<=S.warnDays)return"warn";return"ok"}
function fmtDate(iso){if(!iso)return"";const [y,m,d]=iso.split("-");return S.lang==="fr"?`${d}/${m}/${y}`:`${d}.${m}.${y}.`}
function expLabel(it){const d=daysLeft(it.expiry);if(d===null)return t("noExp");return d<0?t("daysAgo")(-d):t("daysLeft")(d)}
function toast(msg){const el=document.createElement("div");el.className="toast";el.textContent=msg;el.setAttribute("role","status");document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();

const hostTheme=document.documentElement.getAttribute("data-theme");
const mq=window.matchMedia?matchMedia("(prefers-color-scheme: dark)"):null;
function isDark(){const a=document.documentElement.getAttribute("data-theme");return a?a==="dark":!!(mq&&mq.matches)}
function applyTheme(){const r=document.documentElement;
  if(S.theme==="light"||S.theme==="dark")r.setAttribute("data-theme",S.theme);
  else if(hostTheme)r.setAttribute("data-theme",hostTheme);else r.removeAttribute("data-theme");
  const dark=isDark();const b=$("#themeBtn");if(b){b.setAttribute("aria-label",t(dark?"toLight":"toDark"));b.title=t(dark?"toLight":"toDark");
    b.innerHTML=dark?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'}
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=dark?"#19211E":"#1F5163"}
if(mq&&mq.addEventListener)mq.addEventListener("change",()=>applyTheme());
function render(){applyTheme();
  document.documentElement.lang=S.lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===S.lang));
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===S.view));
  ["stock","sug","set"].forEach(v=>$("#view-"+v).hidden=v!==S.view);
  $("#fab").hidden=S.view!=="stock";
  if(S.view==="stock")renderStock(); else if(S.view==="sug")renderSug(); else renderSet();
}
function renderStock(){
  const counts={bad:0,warn:0,ok:0,none:0};items.forEach(i=>counts[status(i)]++);
  const soon=items.filter(i=>status(i)==="warn").sort((a,b)=>daysLeft(a.expiry)-daysLeft(b.expiry));
  const exp=items.filter(i=>status(i)==="bad");
  let list=items.filter(i=>{
    if(S.cat&&i.cat!==S.cat)return false;
    if(S.filter&&status(i)!==S.filter)return false;
    if(S.q){const q=S.q.toLowerCase();if(!(i.name+" "+(i.desc||"")).toLowerCase().includes(q))return false}
    return true});
  const so={exp:(a,b)=>(daysLeft(a.expiry)??1e9)-(daysLeft(b.expiry)??1e9),name:(a,b)=>a.name.localeCompare(b.name),qty:(a,b)=>a.qty-b.qty,new:(a,b)=>b.created-a.created}[S.sort];
  list.sort(so);
  const stat=(k,cls,n,f)=>`<button class="stat ${cls}" data-filter="${f}" aria-pressed="${S.filter===f}"><span class="label">${t(k)}</span><b>${n}</b></button>`;
  const hasEx=items.some(i=>i.ex);
  $("#view-stock").innerHTML=`
   <div class="stats">${stat("total","",items.length,"")}${stat("expired","bad",counts.bad,"bad")}${stat("soon","warn",counts.warn,"warn")}${stat("okS","ok",counts.ok,"ok")}</div>
   ${exp.length?`<div class="alert bad" role="alert"><div><b>${esc(t("alertExp")(exp.length))}</b><ul>${exp.map(i=>`<li>${esc(i.name)} · ${fmtDate(i.expiry)}</li>`).join("")}</ul></div></div>`:""}
   ${soon.length?`<div class="alert" role="status"><div><b>${esc(t("alertSoon")(soon.length))}</b><ul>${soon.slice(0,6).map(i=>`<li>${esc(i.name)} · ${esc(expLabel(i))}</li>`).join("")}</ul></div></div>`:""}
   ${hasEx?`<div class="card" style="flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap"><span class="muted">${t("exNote")}</span><button class="btn small" id="rmEx">${t("removeEx")}</button></div>`:""}
   <div class="toolbar">
     <input type="search" id="q" placeholder="${t("search")}" value="${esc(S.q)}" aria-label="${t("search")}">
     <select id="cat" aria-label="${t("cat")}"><option value="">${t("allCats")}</option>${Object.entries(t("cats")).map(([k,v])=>`<option value="${k}" ${S.cat===k?"selected":""}>${v}</option>`).join("")}</select>
     <select id="sort" aria-label="sort">${["exp","name","qty","new"].map(k=>`<option value="${k}" ${S.sort===k?"selected":""}>${t("sort"+k[0].toUpperCase()+k.slice(1))}</option>`).join("")}</select>
   </div>
   <div class="list">${list.length?list.map(itemHTML).join(""):`<div class="empty">${items.length?t("noMatch"):t("empty")}</div>`}</div>`;
}
function itemHTML(i){
  const st=status(i);
  const w=i.w!==""&&i.w!=null?`<span class="mono">${esc(i.w)} ${esc(unitL(i.u))}</span>`:"";
  return `<article class="item exp-${st}" data-id="${i.id}">
   <div class="thumb">${i.photo?`<img src="${i.photo}" alt="${esc(i.name)}" data-zoom="1" role="button" tabindex="0">`:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>`}</div>

     ${i.desc?`<div class="desc">${esc(i.desc)}</div>`:""}
     <div class="meta">${w}<span>${esc(t("cats")[i.cat]||"")}</span>${i.expiry?`<span class="mono">${fmtDate(i.expiry)}</span>`:""}<span class="pill ${st}">${esc(expLabel(i))}</span></div></div>
   <div class="actions"><div class="qty"><button data-act="minus" aria-label="-1">−</button><span>${i.qty}</span><button data-act="plus" aria-label="+1">+</button></div>
     <button class="btn small ghost" data-act="edit">${t("edit")}</button></div></article>`;
}

/* ---------- render: suggestions ---------- */
function sugAmount(s){
  let n= s.m==="d"? s.q*S.people*S.days : s.m==="p"? s.q*S.people*Math.max(1,S.days/14) : s.q;
  let u=s.u;
  if(u==="g"&&n>=1000){n=n/1000;u="kg"}
  if(s.m==="p"||s.m==="d"){n= (u==="g")? Math.ceil(n/50)*50 : (n<10? Math.ceil(n*2)/2 : Math.ceil(n))}
  if(!u)return "";
  return `${String(+n.toFixed(1)).replace(".",",")} ${unitL(u)}`;
}

   ${SUG.map(c=>{const h=c.items.filter(sugHave).length;return `<div class="cat"><h3>${t("cats")[c.c]} <small>${h}/${c.items.length}</small></h3>
     ${c.items.map(s=>{const have=sugHave(s);return `<div class="sug ${have?"have":""}" data-sid="${s.id}">
       <input type="checkbox" class="chk" id="chk-${s.id}" ${have?"checked":""} aria-label="${t("have")}">
       <label for="chk-${s.id}"><div class="n">${esc(s[S.lang])}</div>${s["n"+S.lang]?`<div class="note">${esc(s["n"+S.lang])}${s.m==="d"?` · ${s.q} ${unitL(s.u)} ${t("perPD")}`:""}</div>`:(s.m==="d"?`<div class="note">${s.q} ${unitL(s.u)} ${t("perPD")}</div>`:"")}</label>
       <div class="amt">${sugAmount(s)}</div>
       <button class="btn small add" data-add="${s.id}">${t("addToStock")}</button></div>`}).join("")}</div>`}).join("")}`;
}

/* ---------- render: settings ---------- */
function notifState(){if(!("Notification" in window)||inFrame)return"unsupported";return Notification.permission}
function renderSet(){setTimeout(renderSyncStatus,0);
  const ns=notifState();
  $("#view-set").innerHTML=`<h2 style="margin-bottom:14px">${t("settings")}</h2>
   <div class="card"><h3>${t("theme")}</h3><div class="seg" role="group" aria-label="${t("theme")}">${[["auto","thAuto"],["light","thLight"],["dark","thDark"]].map(([v,k])=>`<button type="button" data-theme-set="${v}" aria-pressed="${S.theme===v}">${t(k)}</button>`).join("")}</div><p class="muted" style="margin:0;font-size:14px">${t("thHelp")}</p></div>
   <div class="card"><h3>${t("notif")}</h3>
     <label class="field"><span>${t("warnDays")}</span><select id="warnDays" style="max-width:200px">${[7,14,30,60,90].map(d=>`<option ${S.warnDays==d?"selected":""}>${d}</option>`).join("")}</select></label>
     <p class="muted" style="margin:0">${t("notifHelp")}</p>
     <p style="margin:0"><b>${t("notifState")[ns]}</b></p>
     ${ns==="default"?`<div><button class="btn primary" id="notifBtn">${t("notifOn")}</button></div>`:""}
   </div>
   <div class="card" id="syncCard"><h3>${t("sync")}</h3><p style="margin:0" id="syStatus"></p></div>
   <div class="card"><h3>${t("backup")}</h3><p class="muted" style="margin:0">${t("backupHelp")}</p>
     <div class="row"><button class="btn" id="expBtn">${t("exportB")}</button>
       <label class="btn" for="impFile">${t("importB")}</label><input type="file" id="impFile" accept=".json,application/json,text/plain" hidden></div>
     <div id="expOut"></div>
     <label class="field"><span>${t("pasteHere")}</span><textarea class="code" id="impText"></textarea></label>
     <div><button class="btn small" id="impTextBtn">${t("doImport")}</button></div>
   </div>
   <div class="card"><div><button class="btn danger" id="wipeBtn">${t("wipe")}</button></div></div>`;
}

/* ---------- modals ---------- */
function closeModal(){$("#modal").innerHTML=""}
function confirmBox(msg,yes,fn){
  $("#modal").innerHTML=`<div class="scrim"><div class="dialog" role="dialog" aria-modal="true"><p style="margin:0;font-size:17px">${esc(msg)}</p><footer><button class="btn" id="cNo">${t("cancel")}</button><button class="btn danger" id="cYes">${esc(yes)}</button></footer></div></div>`;
  $("#cNo").onclick=closeModal;$("#cYes").onclick=()=>{closeModal();fn()};$("#cYes").focus();
}
let draftPhoto="";
function openForm(it,preset){
  const isNew=!it; it=it||{id:uid(),name:"",desc:"",w:"",u:"g",qty:1,expiry:"",cat:"food",photo:"",created:Date.now(),...preset};
  draftPhoto=it.photo||"";
  $("#modal").innerHTML=`<div class="scrim"><form class="dialog" id="f" role="dialog" aria-modal="true" novalidate>
   <header><h2>${isNew?t("newItem"):t("editItem")}</h2><button type="button" class="btn ghost small" id="fx" aria-label="${t("close")}">✕</button></header>
   <div class="photo"><div class="thumb" id="ph">${draftPhoto?`<img src="${draftPhoto}" alt="">`:""}</div>
     <div class="row" style="flex-direction:column;align-items:flex-start"><div class="row"><label class="btn" for="phIn">${t("takePhoto")}</label><label class="btn" for="phPick">${t("pickPhoto")}</label></div>
       <input type="file" id="phIn" accept="image/*" capture="environment" hidden><input type="file" id="phPick" accept="image/*" hidden>
       <button type="button" class="btn small ghost" id="phRm" ${draftPhoto?"":"hidden"}>${t("removePhoto")}</button></div></div>
   <label class="field"><span>${t("name")} *</span><input type="text" id="fName" value="${esc(it.name)}" required></label>
   <label class="field"><span>${t("desc")}</span><textarea id="fDesc" rows="2">${esc(it.desc)}</textarea></label>
   <div class="grid2">
     <div class="field"><span>${t("weight")}</span><div class="grid3"><input type="number" id="fW" step="any" min="0" inputmode="decimal" value="${esc(it.w)}" aria-label="${t("weight")}"><select id="fU" aria-label="${t("unit")}">${UNITS.map(u=>`<option value="${u}" ${it.u===u?"selected":""}>${unitL(u)}</option>`).join("")}</select></div></div>
     <label class="field"><span>${t("qty")}</span><input type="number" id="fQ" min="0" step="1" inputmode="numeric" value="${it.qty}"></label>
     <label class="field"><span>${t("expiry")}</span><input type="date" id="fE" value="${esc(it.expiry)}"></label>
     <label class="field"><span>${t("cat")}</span><select id="fC">${Object.entries(t("cats")).map(([k,v])=>`<option value="${k}" ${it.cat===k?"selected":""}>${v}</option>`).join("")}</select></label>
   </div>
   <p id="fErr" style="color:var(--bad);margin:0" hidden>${t("required")}</p>
   <footer>${isNew?"":`<button type="button" class="btn danger" id="fDel" style="margin-right:auto">${t("del")}</button>`}
     <button type="button" class="btn" id="fCancel">${t("cancel")}</button><button class="btn primary" type="submit">${t("save")}</button></footer>
  </form></div>`;
  $("#fx").onclick=$("#fCancel").onclick=closeModal;
  $("#phIn").onchange=$("#phPick").onchange=async e=>{const f=e.target.files[0];if(!f)return;draftPhoto=await shrink(f);if(!$("#ph"))return;$("#ph").innerHTML=`<img src="${draftPhoto}" alt="">`;$("#phRm").hidden=false};
  $("#phRm").onclick=()=>{draftPhoto="";$("#ph").innerHTML="";$("#phRm").hidden=true};
  if(!isNew)$("#fDel").onclick=()=>confirmBox(t("confirmDel"),t("yesDel"),()=>{items=items.filter(x=>x.id!==it.id);dbDel(it.id);cloudDel(it);toast(t("deleted"));render()});
  $("#f").onsubmit=e=>{e.preventDefault();const name=$("#fName").value.trim();if(!name){$("#fErr").hidden=false;$("#fName").focus();return}
    const n={...it,name,desc:$("#fDesc").value.trim(),w:$("#fW").value===""?"":+$("#fW").value,u:$("#fU").value,qty:Math.max(0,parseInt($("#fQ").value||"0",10)),expiry:$("#fE").value,cat:$("#fC").value,photo:draftPhoto,ex:false,updated:Date.now(),photoId:draftPhoto?(draftPhoto===it.photo&&it.photoId?it.photoId:uid()):""};
    const idx=items.findIndex(x=>x.id===n.id);if(idx>=0)items[idx]=n;else items.push(n);dbPut(n);cloudSave(n);closeModal();toast(t("saved"));render()};
  if(isNew)setTimeout(()=>$("#fName").focus(),30);
}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const M=1024;let {width:w,height:h}=img;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);let q=.75,u=c.toDataURL("image/jpeg",q);while(u.length>200000&&q>.25){q-=.1;u=c.toDataURL("image/jpeg",q)}res(u)};img.onerror=()=>res("");img.src=r.result};r.onerror=()=>res("");r.readAsDataURL(file)})}

/* ---------- import/export ---------- */
function doImport(txt){
  try{const d=JSON.parse(txt);const arr=Array.isArray(d)?d:d.items;if(!Array.isArray(arr))throw 0;
    let n=0;arr.forEach(x=>{if(!x||!x.name)return;const it={id:x.id||uid(),name:String(x.name),desc:x.desc||"",w:x.w??"",u:UNITS.includes(x.u)?x.u:"g",qty:+x.qty||0,expiry:/^\d{4}-\d\d-\d\d$/.test(x.expiry||"")?x.expiry:"",cat:x.cat||"other",photo:typeof x.photo==="string"&&x.photo.startsWith("data:image")?x.photo:"",created:x.created||Date.now(),sid:x.sid,updated:Date.now()};it.photoId=it.photo?uid():"";
      const i=items.findIndex(y=>y.id===it.id);if(i>=0)items[i]=it;else items.push(it);dbPut(it);cloudSave(it);n++});
    if(d.have)Object.assign(S.have,d.have);saveSettings();cloudSettings();toast(t("imported")(n));render()}
  catch(e){toast(t("badFile"))}
}

/* ---------- Claude account sync (db capability) ---------- */
const cloud={on:false,state:"local",C:null,P:null,SET:null,photos:new Set(),confirmed:false};
let wq=Promise.resolve();
function cloudWrite(fn){wq=wq.then(fn).then(()=>{if(cloud.state!=="on"&&cloud.confirmed){cloud.state="on";renderSyncStatus()}}).catch(e=>{const c=e&&e.code;
  if(c==="invalid_argument"&&!cloud.confirmed){cloud.on=false;cloud.state="local"}else cloud.state=c==="quota_exceeded"?"full":"err";
  if(c==="quota_exceeded")toast(t("cloudFull"));renderSyncStatus()});return wq}
const plain=o=>JSON.parse(JSON.stringify(o));
function cloudSave(it){if(!cloud.on||it.ex)return;const {photo,...rest}=it;
  cloudWrite(async()=>{if(photo&&it.photoId&&!cloud.photos.has(it.photoId)){await cloud.P.doc(it.photoId).set({d:photo});cloud.photos.add(it.photoId)}
    await cloud.C.doc(it.id).set(plain(rest))})}
function cloudDel(it){if(!cloud.on||it.ex)return;cloudWrite(async()=>{await cloud.C.doc(it.id).delete();if(it.photoId)await cloud.P.doc(it.photoId).delete()})}
const qtyTimers={};
function cloudQty(it){if(!cloud.on||it.ex)return;clearTimeout(qtyTimers[it.id]);qtyTimers[it.id]=setTimeout(()=>{const {photo,...rest}=it;cloudWrite(()=>cloud.C.doc(it.id).set(plain(rest)))},900)}
let setTimer=null;
function cloudSettings(){if(!cloud.on)return;clearTimeout(setTimer);setTimer=setTimeout(()=>cloudWrite(()=>cloud.SET.set(plain({have:S.have,cfg:{people:S.people,days:S.days,warnDays:S.warnDays,t:S.cfgT||0}}))),900)}
function renderSyncStatus(){const el=$("#syStatus");if(!el)return;
  const m={on:["cloudOn","var(--ok)"],wait:["cloudWait","var(--muted)"],err:["cloudErr","var(--warn)"],full:["cloudFull","var(--bad)"]}[cloud.on?cloud.state:""]||["cloudLocal","var(--muted)"];
  el.textContent=t(m[0]);el.style.color=m[1]}
function safeRender(){if(!$("#modal").innerHTML&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName))render();else renderSyncStatus()}
async function cloudInit(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  let db=null,user=null;try{[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")])}catch(e){}
  if(!db||!user)return;
  let uid=null;try{uid=await user.id()}catch(e){}
  if(!uid)return;
  let can=null;try{can=await user.can("data.write")}catch(e){}
  if(can===false)return;
  const base=db.doc(`data/users/${uid}/stock/main`);
  Object.assign(cloud,{on:true,state:"wait",C:base.collection("items"),P:base.collection("photos"),SET:db.doc(`data/users/${uid}/settings/main`)});
  renderSyncStatus();
  // first time on this device: upload what was entered here before sync existed
  const mk="rezerva.migrated."+uid;let migrated=false;try{migrated=localStorage.getItem(mk)==="1"}catch(e){}
  if(!migrated){items.filter(i=>!i.ex).forEach(cloudSave);if(Object.keys(S.have).length)cloudSettings();
    wq.then(()=>{if(cloud.on)try{localStorage.setItem(mk,"1")}catch(e){}})}
  const timer=setTimeout(()=>{if(cloud.state==="wait"){cloud.state="err";renderSyncStatus()}},10000);
  const fetching=new Set();
  cloud.C.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);cloud.confirmed=true;if(cloud.state==="wait"||cloud.state==="err")cloud.state="on"}
    const photoById={};items.forEach(i=>{if(i.photoId&&i.photo)photoById[i.photoId]=i.photo});
    const list=snap.docs.map(d=>{const it={...d.data(),id:d.id};it.photo=it.photoId?(photoById[it.photoId]||""):"";return it});
    const ids=new Set(list.map(i=>i.id));
    // until the server confirms, keep local items whose upload is still pending
    const pendingLocal=snap.metadata.fromCache?items.filter(i=>!i.ex&&!ids.has(i.id)):[];
    items=[...list,...pendingLocal,...(list.length?[]:items.filter(i=>i.ex))];
    dbClear();items.forEach(dbPut);
    list.forEach(it=>{if(it.photoId&&!it.photo&&!fetching.has(it.photoId)){fetching.add(it.photoId);
      cloud.P.doc(it.photoId).get().then(ps=>{fetching.delete(it.photoId);const d=ps.exists&&ps.data().d;if(!d)return;
        cloud.photos.add(it.photoId);items.filter(x=>x.photoId===it.photoId).forEach(x=>{x.photo=d;dbPut(x)});safeRender()}).catch(()=>fetching.delete(it.photoId))}
      else if(it.photo)cloud.photos.add(it.photoId)});
    safeRender();checkNotify();
  },e=>{clearTimeout(timer);cloud.state=e&&e.code==="quota_exceeded"?"full":"err";renderSyncStatus()});
  cloud.SET.onSnapshot(sn=>{if(!sn.exists)return;const d=sn.data();
    if(d.have)S.have={...d.have};
    if(d.cfg&&(d.cfg.t||0)>(S.cfgT||0)){S.people=d.cfg.people;S.days=d.cfg.days;S.warnDays=d.cfg.warnDays;S.cfgT=d.cfg.t}
    saveSettings();safeRender()},()=>{});
}

/* ---------- notifications ---------- */
function checkNotify(){
  const due=items.filter(i=>!i.ex&&(status(i)==="warn"||status(i)==="bad"));
  if(!due.length||notifState()!=="granted")return;
  const key="rezerva.lastNotif";let last="";try{last=localStorage.getItem(key)||""}catch(e){}
  if(last===todayISO())return;
  const body=due.slice(0,5).map(i=>`${i.name}: ${expLabel(i)}`).join("\n");
  try{ if(navigator.serviceWorker&&navigator.serviceWorker.controller){navigator.serviceWorker.ready.then(r=>r.showNotification(t("notifTitle"),{body,icon:"icon.svg",tag:"rezerva"}))} else new Notification(t("notifTitle"),{body}); localStorage.setItem(key,todayISO())}catch(e){}
}

/* ---------- events ---------- */
function openViewer(src,name){$("#modal").innerHTML=`<div class="viewer" id="viewer" role="dialog" aria-modal="true"><button type="button" aria-label="${t("close")}">✕</button><img src="${src}" alt=""><p></p></div>`;$("#viewer p").textContent=name;$("#viewer").onclick=closeModal}
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset?.zoom){e.preventDefault();openViewer(e.target.src,e.target.alt)}});
document.addEventListener("click",e=>{
  if(e.target.dataset?.zoom){openViewer(e.target.src,e.target.alt);return}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.lang){S.lang=b.dataset.lang;saveSettings();render();return}
  if(b.dataset.view){S.view=b.dataset.view;saveSettings();render();window.scrollTo(0,0);return}
  if(b.id==="fab"){openForm();return}
  if(b.id==="themeBtn"){S.theme=isDark()?"light":"dark";saveSettings();render();return}
  if(b.dataset.themeSet){S.theme=b.dataset.themeSet;saveSettings();render();return}
  if(b.dataset.filter!==undefined&&b.classList.contains("stat")){S.filter=S.filter===b.dataset.filter?"":b.dataset.filter;render();return}
  if(b.id==="rmEx"){items.filter(i=>i.ex).forEach(i=>dbDel(i.id));items=items.filter(i=>!i.ex);render();return}
  const art=b.closest(".item");
  if(art){const it=items.find(i=>i.id===art.dataset.id);if(!it)return;
    if(b.dataset.act==="edit")openForm(it);
    if(b.dataset.act==="plus"||b.dataset.act==="minus"){it.qty=Math.max(0,it.qty+(b.dataset.act==="plus"?1:-1));if(!it.ex){it.updated=Date.now();cloudQty(it)}dbPut(it);art.querySelector(".qty span").textContent=it.qty}
    return}
  if(b.dataset.add){const s=SUG.flatMap(c=>c.items).find(x=>x.id===b.dataset.add);const cat=SUG.find(c=>c.items.includes(s)).c;
    openForm(null,{name:s[S.lang],desc:s["n"+S.lang]||"",cat,sid:s.id,u:UNITS.includes(s.u)?s.u:"kom"});return}
  if(b.id==="notifBtn"){try{Notification.requestPermission().then(()=>{render();checkNotify()})}catch(e){}return}
  if(b.id==="expBtn"){const data=JSON.stringify({app:"rezerva",v:1,exported:new Date().toISOString(),have:S.have,items:items.filter(i=>!i.ex)});
    if(!inFrame){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=`rezerva-${todayISO()}.json`;a.click();return}catch(e){}}
    $("#expOut").innerHTML=`<p class="muted" style="margin:0 0 6px">${t("exportHelp")}</p><textarea class="code" id="expTa" readonly></textarea><div style="margin-top:6px"><button class="btn small" id="copyBtn">${t("copy")}</button></div>`;$("#expTa").value=data;return}
  if(b.id==="copyBtn"){const ta=$("#expTa");const done=()=>toast(t("copied"));try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select()})}catch(e){ta.select()}return}
  if(b.id==="impTextBtn"){const v=$("#impText").value.trim();if(v)doImport(v);return}
  if(b.id==="wipeBtn"){confirmBox(t("wipeQ"),t("wipe"),()=>{items.filter(i=>!i.ex).forEach(cloudDel);items=[];dbClear();Object.keys(S.have).forEach(k=>S.have[k]={v:false,t:Date.now()});cloudSettings();S.seeded=true;saveSettings();toast(t("wiped"));render()});return}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){S.q=e.target.value;const pos=e.target.selectionStart;renderStock();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="cat"){S.cat=e.target.value;saveSettings();renderStock()}
  if(id==="sort"){S.sort=e.target.value;saveSettings();renderStock()}
  if(id==="people"){S.people=Math.min(20,Math.max(1,parseInt(e.target.value||"1",10)));S.cfgT=Date.now();saveSettings();cloudSettings();renderSug()}
  if(id==="days"){S.days=+e.target.value;S.cfgT=Date.now();saveSettings();cloudSettings();renderSug()}
  if(id==="warnDays"){S.warnDays=+e.target.value;S.cfgT=Date.now();saveSettings();cloudSettings()}
  if(e.target.classList.contains("chk")){const sid=e.target.closest(".sug").dataset.sid;S.have[sid]={v:e.target.checked,t:Date.now()};saveSettings();cloudSettings();renderSug()}
  if(id==="impFile"){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(r.result);r.readAsText(f)}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal").innerHTML)closeModal()});

/* ---------- boot ---------- */
(async()=>{
  await openDB();
  const stored=await dbAll();
  items=stored||[];
  if(!items.length&&!S.seeded){items=seed();items.forEach(dbPut);S.seeded=true;saveSettings()}
  render();checkNotify();cloudInit();
  if(!inFrame&&navigator.storage&&navigator.storage.persist){try{navigator.storage.persist()}catch(e){}}
  setInterval(()=>{if(S.view==="stock"&&!$("#modal").innerHTML&&document.activeElement?.id!=="q")renderStock();checkNotify()},3600000);
  if("serviceWorker" in navigator&&!inFrame&&location.protocol.startsWith("http")){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
})();
})();
</script>
</body></html>
